<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approve KDP Upload - Libra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-800 rounded-2xl p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-amber-400 mb-2 text-center">Approve Upload</h1>
    <p class="text-slate-400 text-center mb-6">Click below to upload this book to KDP</p>

    <div id="loading" class="hidden">
      <div class="flex items-center justify-center gap-3">
        <div class="animate-spin h-5 w-5 border-2 border-amber-400 border-t-transparent rounded-full"></div>
        <span>Uploading to KDP...</span>
      </div>
    </div>

    <div id="success" class="hidden text-center">
      <p class="text-green-400 text-lg font-bold mb-2">✅ Approved!</p>
      <p class="text-slate-300">Your book is being uploaded to KDP.</p>
      <p class="text-slate-400 text-sm mt-2">Check Telegram for updates.</p>
    </div>

    <div id="error" class="hidden text-center">
      <p class="text-red-400 text-lg font-bold mb-2">❌ Error</p>
      <p id="error-msg" class="text-slate-300"></p>
    </div>

    <div id="form">
      <button onclick="approveUpload()" class="w-full bg-amber-400 text-slate-900 py-3 rounded-lg font-bold hover:bg-amber-500 transition">
        ✅ Approve & Upload to KDP
      </button>
    </div>
  </div>

  <script>
    const slug = new URLSearchParams(window.location.search).get('slug') || window.location.pathname.split('/').pop();

    async function approveUpload() {
      document.getElementById('form').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');

      try {
        const res = await fetch(`api/books/${slug}/approve-kdp`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' }
        });

        if (res.ok) {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('success').classList.remove('hidden');
        } else {
          throw new Error(await res.text());
        }
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('error-msg').textContent = err.message;
      }
    }
  </script>
</body>
</html>
