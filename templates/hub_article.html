<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{SUMMARY}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{SUMMARY}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <script type="application/ld+json">{{JSON_LD}}</script>
  <style>{{THEME_CSS}}</style>
</head>
<body class="article-page">
  <a class="skip-link" lang="{{UI_LANG}}" href="#article-content">{{SKIP_LABEL}}</a>
  {{GUIDE_NAV}}
  <main id="article-content" class="reading-surface">
    <header class="article-header"><p class="eyebrow" lang="{{UI_LANG}}">{{ARTICLE_LABEL}}</p><h1>{{TITLE}}</h1><p class="article-summary">{{SUMMARY}}</p></header>
    <div class="article-body">{{BODY}}</div>
    <aside class="disclosure" lang="{{UI_LANG}}" aria-label="{{DISCLOSURE_LABEL}}"><strong>{{DISCLOSURE_LABEL}}</strong><p lang="{{LANG}}">{{DISCLOSURE}}</p></aside>
    <p class="editorial" lang="en">{{EDITORIAL_NOTE}}</p>
    <aside class="book-dock glass-control" aria-labelledby="article-book-title">
      <img src="{{BOOK_COVER}}" alt="{{BOOK_COVER_ALT}}" lang="{{UI_LANG}}" width="128" loading="lazy">
      <div>
        <p class="dock-label" lang="{{UI_LANG}}">{{BOOK_LABEL}}</p>
        <h2 id="article-book-title">{{BOOK_TITLE}}</h2>
        <p>{{BOOK_LINE}}</p>
        <p class="format" lang="en">{{BOOK_FORMAT}}</p>
        <a class="cta" lang="{{CTA_LANG}}" href="{{CTA_URL}}" rel="nofollow sponsored">{{CTA_LABEL}}</a>
      </div>
    </aside>
    {{RELATED}}
  </main>
</body>
</html>
